name: Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality and database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chatbot_test
          POSTGRES_PASSWORD: chatbot_test
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot_test -d chatbot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect backend
        id: detect
        shell: bash
        run: |
          if [[ -f backend/pyproject.toml ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install backend with dev dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Check formatting and lint
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: python -m mypy app
      - name: Apply migrations to disposable CI database
        if: steps.detect.outputs.present == 'true' && hashFiles('backend/alembic.ini') != ''
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://chatbot_test:chatbot_test@localhost:5432/chatbot_test
          TEST_DATABASE_URL: postgresql+asyncpg://chatbot_test:chatbot_test@localhost:5432/chatbot_test
        run: python -m alembic upgrade head
      - name: Run backend tests with coverage
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://chatbot_test:chatbot_test@localhost:5432/chatbot_test
          TEST_DATABASE_URL: postgresql+asyncpg://chatbot_test:chatbot_test@localhost:5432/chatbot_test
          LLM_PROVIDER: mock
          LLM_API_KEY: ""
        run: python -m pytest tests -q --cov=app --cov-branch --cov-report=term-missing
      - name: Check requirements traceability when Phase 1 docs exist
        if: hashFiles('docs/requirements.md', 'docs/requirements-traceability.csv') != ''
        run: python scripts/phase_gate.py --phase 1
      - name: Check curriculum scenario coverage when Phase 2 specs exist
        if: hashFiles('docs/curriculum.md', 'backend/tests/fixtures/progression_cases.json') != ''
        run: python scripts/phase_gate.py --phase 2
      - name: Run offline model-safety evaluation when implemented
        if: hashFiles('scripts/run_safety_eval.py') != ''
        run: python scripts/run_safety_eval.py --mode offline --check-thresholds

  frontend:
    name: Frontend quality, build, and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detect frontend
        id: detect
        shell: bash
        run: |
          if [[ -f frontend/package.json && -f frontend/package-lock.json ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Type check
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend unit tests
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run test:ci
      - name: Production build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Install Playwright browser if E2E exists
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            npx playwright install --with-deps chromium
          else
            echo "E2E script not introduced yet; the Phase 6 gate requires it."
          fi
      - name: End-to-end tests
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run test:e2e --if-present
